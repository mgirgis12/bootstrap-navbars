<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Navbars</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRI14kxILFvY47J16cr9ZwB0zvP4J8+LH7qK0nugkuIAvNWLzeN8tE5VBuZqJ0LB"
        crossorigin="anonymous" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Boardroom Navbar -->
  <div class="container-fluid px-0">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container">

        <!-- Instagram Icon -->
        <ul class="nav justify-content-start">
          <li class="nav-item">
            <a class="navbar-brand" href="#">
              <i class="bi bi-instagram"></i>
            </a>
            </li>
            </ul>

        <!-- Boardroom Logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img src="boardroom-logo.png" alt="The Boardroom Logo">
          </li>
          </ul>

        <!-- Menu Button -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <button class="btn btn-dark">Menu</button>
          </li>
          </ul>

</div>
</nav>
</div>

  <!-- Bootstrap 5 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlYvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

</body>

</html>
